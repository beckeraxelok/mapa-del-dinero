<style>
/* Layout: una sola columna angosta tipo "sesión": pantallas que se suceden, y un resultado que se lee como un informe. Marca TMG: negro, dorado, Georgia + Arial. */
:root{
  --bg:#110F0D; --surface:#1A1815; --raised:#221F1B; --line:#3A342A;
  --fg:#FAF6EE; --muted:#B8AE95; --dim:#8A7F66;
  --gold:#C5A55A; --gold-deep:#A87C2A; --gold-pale:#E2C67E;
  --red:#E0645A; --green:#5DBB7E; --wa:#25D366;
  --serif:Georgia,"EB Garamond","Times New Roman",serif;
  --sans:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:680px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;padding-block:20px;border-bottom:1px solid var(--line)}
header.top img{height:26px;width:auto}
header.top span{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
h1,h2,h3{font-family:var(--serif);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.screen{padding-block:40px 24px;display:flex;flex-direction:column;gap:24px}
.btn{appearance:none;border:0;cursor:pointer;font:700 15px/1 var(--sans);letter-spacing:.06em;padding:18px 26px;border-radius:4px;
  background:var(--gold);color:#171614;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;min-height:54px}
.btn:hover{background:var(--gold-pale)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,.ghost:focus-visible{outline:2px solid var(--gold-pale);outline-offset:3px}
.btn.wa{background:var(--wa);color:#0B2615;font-size:16px;width:100%}
.btn.wa:hover{background:#4BE07F}
.ghost{appearance:none;background:transparent;border:1px solid var(--line);color:var(--muted);font:600 14px/1 var(--sans);padding:14px 18px;border-radius:4px;cursor:pointer;min-height:48px}
.ghost:hover{border-color:var(--gold);color:var(--fg)}
/* intro */
.intro h1{font-size:clamp(40px,9vw,64px);line-height:1.04}
.intro .lead{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.45;color:var(--gold-pale)}
.intro .body{color:var(--muted);font-size:16px}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--dim);letter-spacing:.04em}
.facts b{color:var(--fg);font-weight:600}
/* quiz */
.progress{display:flex;flex-direction:column;gap:10px;padding-top:28px}
.progress .row{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
.q{font-size:clamp(26px,6vw,34px);line-height:1.2}
.qhint{color:var(--dim);font-size:14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);color:var(--fg);
  font:16px/1.4 var(--sans);padding:16px 18px;border-radius:4px;cursor:pointer;display:flex;gap:14px;align-items:center}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:#2A2418}
.opt .k{flex:none;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.opt.sel .k{background:var(--gold);border-color:var(--gold);color:#171614}
.navrow{display:flex;justify-content:space-between;align-items:center}
.part{display:inline-flex;align-self:flex-start;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);border:1px solid #4A3F28;padding:6px 10px;border-radius:3px}
/* form */
form{display:flex;flex-direction:column;gap:18px}
label{display:flex;flex-direction:column;gap:8px;font-size:13px;letter-spacing:.06em;color:var(--muted)}
input[type=text],input[type=email],input[type=tel]{background:var(--surface);border:1px solid var(--line);color:var(--fg);font:16px var(--sans);padding:15px 14px;border-radius:4px;width:100%}
input::placeholder{color:#6E6552}
.err{color:var(--red);font-size:14px;min-height:20px}
.privacy{font-size:12px;color:var(--dim)}
/* result */
.res-head{padding-block:40px 8px;display:flex;flex-direction:column;gap:14px}
.res-head .who{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.arch{font-size:clamp(44px,11vw,72px);line-height:1;color:var(--gold)}
.quote{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--fg)}
.chip{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:7px 12px;border-radius:999px;border:1px solid}
.chip.red{color:var(--red);border-color:#6B2F2A}
.section{border-top:1px solid var(--line);padding-block:32px;display:flex;flex-direction:column;gap:18px}
.section h2{font-size:28px;line-height:1.2}
.map{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:center}
@media (min-width:640px){.map{grid-template-columns:300px minmax(0,1fr)}}
.map svg{width:100%;max-width:320px;height:auto;justify-self:center}
.legend{display:flex;flex-direction:column;gap:14px}
.lrow{display:grid;grid-template-columns:104px minmax(0,1fr) 112px;gap:12px;align-items:center;font-size:14px}
.lrow .nm{color:var(--fg)}
.lrow .track{height:8px;background:var(--raised);border-radius:4px;overflow:hidden}
.lrow .track i{display:block;height:100%;border-radius:4px}
.lrow .st{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:right}
.hi{color:var(--red)} .md{color:var(--gold)} .lo{color:var(--green)}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:8px}
.card h3{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.card p{font-size:16px;color:var(--fg)}
.card.unlock{border-color:var(--gold);background:#231E14}
.card.unlock h3{color:var(--gold)}
.card.unlock p{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.35;color:var(--gold-pale)}
.second{display:flex;flex-direction:column;gap:6px;padding:18px 20px;border-left:2px solid var(--gold-deep);background:var(--surface)}
.second .lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.second b{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--fg)}
.origin p{color:var(--muted)}
.origin ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.origin li{display:flex;flex-direction:column;gap:2px;padding:14px 16px;background:var(--surface);border-radius:4px}
.origin li span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.origin li em{font-family:var(--serif);font-size:19px;color:var(--fg)}
.story{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:14px}
.story p{color:#DCD3BE}
.story .sig{font-family:var(--serif);font-style:italic;color:var(--gold)}
.steps{display:flex;flex-direction:column;gap:14px;counter-reset:s}
.step{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px}
.step .n{width:36px;height:36px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);color:var(--gold)}
.step b{display:block;font-size:17px;color:var(--fg);margin-bottom:2px}
.step p{color:var(--muted);font-size:15px}
.cta{background:linear-gradient(180deg,#1E1A13,#16130F);border:1px solid var(--gold-deep);border-radius:6px;padding:26px 22px;display:flex;flex-direction:column;gap:16px}
.cta h2{font-size:30px}
.cta .msg{font-size:14px;color:var(--muted);background:var(--bg);border:1px dashed var(--line);padding:12px 14px;border-radius:4px}
.cta .phone{font-size:13px;color:var(--dim);text-align:center}
.cta .phone b{color:var(--fg);user-select:all}
.dl{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.dlnote{font-size:13px;color:var(--dim);text-align:center;min-height:18px}
.disc{font-size:12px;font-style:italic;color:var(--dim);padding-top:24px}
.hero-img{display:block;width:min(64%,320px);height:auto;margin:0 auto -8px;filter:drop-shadow(0 0 40px rgba(197,165,90,.18))}
.mid-img{display:block;width:min(56%,260px);height:auto;margin:4px auto 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fin .35s ease both}
@keyframes fin{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

function scores(){
  const s = {}; ORDER.forEach(k=>s[k]={sum:0,n:0,boost:0});
  STATEMENTS.forEach(([k],i)=>{ if(state.ans[i]!=null){ s[k].sum+=state.ans[i]; s[k].n++; } });
  ORIGIN.forEach(o=>{ const v=state.org[o.id]; if(v!=null){ const t=o.opts[v][1]; if(t) s[t].boost+=12; } });
  const out={};
  ORDER.forEach(k=>{ const base = s[k].n ? ((s[k].sum - s[k].n)/(4*s[k].n))*100 : 0; out[k]=Math.round(Math.min(100, base*0.88 + s[k].boost)); });
  return out;
}

function level(v){ return v>=65?["hi","Bloqueo alto","#E0645A"]: v>=40?["md","En tensión","#C5A55A"]:["lo","Liberada","#5DBB7E"]; }

function progress(i,part){
  return `<div class="progress"><div class="row"><span>${part}</span><span>${i+1} / ${TOTAL}</span></div><div class="bar"><i style="width:${Math.round((i)/TOTAL*100)}%"></i></div></div>`;
}

function render(){
  window.scrollTo({top:0});
  const st = state.step;
  if(st===-1) return renderIntro();
  if(st < STATEMENTS.length) return renderStatement(st);
  if(st < TOTAL) return renderOrigin(st - STATEMENTS.length);
  if(st === TOTAL) return renderForm();
  return renderResult();
}

function renderIntro(){
  app.innerHTML = `<section class="screen intro fade">
    <img class="hero-img" src="${HEAD}" alt="Ilustración de una cabeza con un laberinto dorado, candados que se abren y cadenas que se rompen">
    <p class="eyebrow">Regalo de la Masterclass</p>
    <h1>Tu Mapa del Dinero</h1>
    <p class="lead">La mayoría de las decisiones que tomás con tu dinero no las tomás vos. Las toma un programa que se instaló mucho antes de que cobraras tu primer sueldo.</p>
    <p class="body">Este mapa te muestra cuál es tu creencia dominante, de dónde viene, qué te está costando en tu portfolio y qué se desbloquea cuando la trabajás.</p>
    <div class="facts"><span><b>16</b> preguntas</span><span><b>5</b> minutos</span><span>Respondé lo primero que sientas, no lo que “debería” ser</span></div>
    <div><button class="btn" id="go">Empezar mi mapa →</button></div>
  </section>`;
  document.getElementById("go").onclick=()=>{state.step=0;render();};
}

function optList(opts, sel){
  return `<div class="opts" role="radiogroup">${opts.map((t,i)=>`<button class="opt${sel===i?' sel':''}" role="radio" aria-checked="${sel===i}" data-i="${i}"><span class="k">${i+1}</span><span>${esc(t)}</span></button>`).join("")}</div>`;
}
function nav(showBack){
  return `<div class="navrow">${showBack?'<button class="ghost" id="back">← Volver</button>':'<span></span>'}<span></span></div>`;
}
function bindOpts(onPick){
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    app.querySelectorAll(".opt").forEach(x=>{x.classList.remove("sel");x.setAttribute("aria-checked","false")});
    b.classList.add("sel"); b.setAttribute("aria-checked","true");
    onPick(+b.dataset.i); setTimeout(()=>{state.step++;render();},220);
  });
  const back=document.getElementById("back"); if(back) back.onclick=()=>{state.step--;render();};
}

function renderStatement(i){
  const [,txt]=STATEMENTS[i];
  app.innerHTML = progress(i,"Parte 1 · Tus creencias")+`<section class="screen fade">
    ${i===0?'<p class="qhint">¿Cuánto te representa cada frase?</p>':''}
    <h2 class="q">${esc(txt)}</h2>
    ${optList(SCALE, state.ans[i]==null?null:state.ans[i]-1)}
    ${nav(true)}
  </section>`;
  bindOpts(v=>state.ans[i]=v+1);
  const back=document.getElementById("back"); if(back) back.onclick=()=>{state.step--;render();};
}

function renderOrigin(j){
  const o=ORIGIN[j];
  app.innerHTML = progress(STATEMENTS.length+j,"Parte 2 · De dónde viene")+`<section class="screen fade">
    ${j===0?'<p class="qhint">Ahora vamos a tu casa. Las creencias sobre el dinero casi nunca se eligen: se heredan.</p>':''}
    <h2 class="q">${esc(o.q)}</h2>
    ${optList(o.opts.map(x=>x[0]), state.org[o.id]??null)}
    ${nav(true)}
  </section>`;
  bindOpts(v=>state.org[o.id]=v);
}

function renderForm(){
  const L=state.lead;
  app.innerHTML = progress(TOTAL-1,"Último paso").replace(`${TOTAL} / ${TOTAL}`,"Listo")+`<section class="screen fade">
    <p class="eyebrow">Tu mapa está listo</p>
    <h2 class="q">¿A nombre de quién lo armo?</h2>
    <form id="f" novalidate>
      <label for="name">Nombre<input id="name" type="text" autocomplete="given-name" placeholder="Tu nombre" value="${esc(L.name)}"></label>
      <label for="email">Email<input id="email" type="email" autocomplete="email" placeholder="tu@email.com" value="${esc(L.email)}"></label>
      <label for="phone">Celular (con código de país)<input id="phone" type="tel" autocomplete="tel" placeholder="+54 9 11 1234-5678" value="${esc(L.phone)}"></label>
      <div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;letter-spacing:.06em;color:var(--muted)">¿Hoy invertís?</span>
        <div class="opts" id="inv">${INVEST.map((t,i)=>`<button type="button" class="opt${L.invest===t?' sel':''}" data-i="${i}"><span class="k">${i+1}</span><span>${esc(t)}</span></button>`).join("")}</div>
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit">Ver mi Mapa del Dinero →</button>
      <p class="privacy">Usamos tus datos solo para enviarte tu mapa y contactarte sobre TMG.</p>
    </form>
    <div class="navrow"><button class="ghost" id="back">← Volver</button><span></span></div>
  </section>`;
  app.querySelectorAll("#inv .opt").forEach(b=>b.onclick=()=>{app.querySelectorAll("#inv .opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");state.lead.invest=INVEST[+b.dataset.i];});
  document.getElementById("back").onclick=()=>{state.step--;render();};
  document.getElementById("f").onsubmit=e=>{
    e.preventDefault();
    const name=document.getElementById("name").value.trim(), email=document.getElementById("email").value.trim(), phone=document.getElementById("phone").value.trim();
    Object.assign(state.lead,{name,email,phone});
    const err=document.getElementById("err");
    if(!name) return err.textContent="Escribí tu nombre para armar el mapa.";
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err.textContent="Revisá el email: parece que le falta algo.";
    if(phone.replace(/\D/g,"").length<8) return err.textContent="Escribí tu celular con código de área.";
    if(!state.lead.invest) return err.textContent="Elegí una opción en “¿Hoy invertís?”.";
    sendLead();
    state.step++; render();
  };
}

/* Radar SVG */
function radar(sc){
  const cx=160,cy=160,R=112, n=ORDER.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let g="";
  [0.33,0.66,1].forEach(f=>{g+=`<polygon points="${ORDER.map((_,i)=>pt(i,R*f).join(",")).join(" ")}" fill="none" stroke="#3A342A" stroke-width="1"/>`;});
  ORDER.forEach((_,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#3A342A"/>`;});
  const poly=ORDER.map((k,i)=>pt(i,Math.max(8,R*sc[k]/100)).join(",")).join(" ");
  g+=`<polygon points="${poly}" fill="rgba(197,165,90,0.22)" stroke="#C5A55A" stroke-width="2" stroke-linejoin="round"/>`;
  ORDER.forEach((k,i)=>{const [x,y]=pt(i,Math.max(8,R*sc[k]/100));g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${level(sc[k])[2]}"/>`;});
  ORDER.forEach((k,i)=>{const [x,y]=pt(i,R+26);const anchor=Math.abs(x-cx)<6?"middle":(x>cx?"start":"end");
    g+=`<text x="${x}" y="${y+4}" text-anchor="${anchor}" fill="#B8AE95" font-family="Arial" font-size="12" letter-spacing="1">${B[k].emo.toUpperCase()}</text>`;});
  return `<svg viewBox="-40 0 400 320" role="img" aria-label="Mapa de intensidad de tus seis creencias sobre el dinero">${g}</svg>`;
}

function waText(top){
  const L=state.lead;
  return `Hola Axel, soy ${L.name}. Hice el Mapa del Dinero y mi perfil es ${B[top].arch}. Quiero saber cómo trabajarlo en sesiones 1 a 1.\n\nHoy invierto: ${L.invest}.\nEmail: ${L.email}`;
}

function sendLead(){
  if(!SHEET_URL || SHEET_URL.indexOf("http")!==0) return;
  const sc=scores(), rk=ranked(sc), L=state.lead;
  const org={}; ORIGIN.forEach(o=>{const v=state.org[o.id]; org[o.id]= v==null?"":o.opts[v][0];});
  const payload={name:L.name,email:L.email,phone:L.phone,invest:L.invest,top:B[rk[0]].arch,second:B[rk[1]].arch,
    scores:ORDER.map(k=>sc[k]),casa:org.casa,frase:org.frase,papas:org.papas,ricos:org.ricos,source:SOURCE};
  try{ fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),keepalive:true}).catch(()=>{}); }catch(e){}
}

function renderResult(){
  const sc=scores(), rk=ranked(sc), top=rk[0], sec=rk[1], A=B[top], L=state.lead;
  const msg=waText(top);
  const waUrl=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  const originRows = ORIGIN.map(o=>{const v=state.org[o.id];return v==null?"":`<li><span>${esc(o.label)}</span><em>${esc(o.opts[v][0])}</em></li>`;}).join("");
  app.innerHTML = `<div class="fade">
  <section class="res-head">
    <p class="who">Mapa del Dinero de ${esc(L.name)}</p>
    <p class="eyebrow">Tu creencia dominante</p>
    <h1 class="arch">${A.arch}</h1>
    <p class="quote">${A.quote}</p>
    <span class="chip red">Emoción: ${A.emo}</span>
  </section>

  <section class="section">
    <h2>Tu mapa</h2>
    <div class="map">${radar(sc)}
      <div class="legend">${ORDER.map(k=>{const [c,t,col]=level(sc[k]);return `<div class="lrow"><span class="nm">${B[k].emo}</span><span class="track"><i style="width:${Math.max(4,sc[k])}%;background:${col}"></i></span><span class="st ${c}">${t}</span></div>`;}).join("")}</div>
    </div>
    <p style="color:var(--dim);font-size:14px">Cuanto más afuera el punto, más fuerte es esa creencia en tus decisiones con el dinero.</p>
  </section>

  <section class="section">
    <h2>Cómo te está jugando en contra</h2>
    <div class="cards">
      <div class="card"><h3>Cómo se ve en tu dinero</h3><p>${A.see}</p></div>
      <div class="card"><h3>Lo que te está costando</h3><p>${A.cost}</p></div>
      <div class="card unlock"><h3>Tu desbloqueo</h3><p>${A.unlock}</p></div>
    </div>
    <div class="second"><span class="lbl">Tu segundo punto a trabajar</span><b>${B[sec].arch} · ${B[sec].emo}</b><span style="color:var(--muted);font-size:15px">${B[sec].quote} ${B[sec].see}</span></div>
  </section>

  <section class="section origin">
    <h2>De dónde viene</h2>
    <ul>${originRows}</ul>
    <p>Estas creencias no las elegiste. Las aprendiste de la gente que más te quiso, y muchas veces vienen de su esfuerzo y de su amor. Por eso cuestan tanto soltarlas: se sienten como parte de quién sos.</p>
  </section>

  <section class="section">
    <p class="eyebrow">Yo también tuve este mapa</p>
    <div class="story">
      <p>Crecí en una casa donde el dinero se ganaba con el cuerpo. Escuchaba <i>“hay que trabajar duro para conseguir dinero”</i> y <i>“no se puede todo en la vida”</i>. Y si veíamos a alguien con plata en la calle, la conclusión era automática: <i>“seguro vende droga”</i>.</p>
      <p>Vi a mis papás trabajar 14 horas por día para que a mis hermanos y a mí nunca nos faltara nada. Y nunca nos faltó. Les voy a estar eternamente agradecido.</p>
      <p>Por eso mismo me costó tanto. Cada vez que empezaba a ganar más, algo adentro mío me frenaba. Sentía que querer más era traicionarlos, como si dejar de sufrir por el dinero fuera faltarle el respeto a todo lo que ellos habían dado.</p>
      <p>Tardé años en entenderlo. Lo trabajé en sesiones 1 a 1 con mentores, con journaling y con mucha introspección. Y un día entendí algo que me cambió la vida: honrarlos no era repetir su historia. Era llevarla más lejos.</p>
      <p>Hoy gano 20 veces más en dólares que hace 5 años. Tengo el hogar que soñaba. Este año viví 2 meses en Europa y viajé a la Patagonia, a México y a Punta del Este.</p>
      <p>Pero lo que más cambió no fue el número. Fue la sensación. Hoy vivo en paz con el dinero, sabiendo que nunca me va a faltar.</p>
      <p class="sig">Axel</p>
    </div>
  </section>

  <section class="section">
    <img class="mid-img" src="${HEAD}" alt="" aria-hidden="true">
    <h2>Esto no se cambia leyendo</h2>
    <p style="color:var(--muted)">Tu mapa te muestra el programa. Pero el programa vive en tu subconsciente, y ahí no se llega con fuerza de voluntad ni con un PDF. Se reprograma en profundidad, en sesiones 1 a 1:</p>
    <div class="steps">
      <div class="step"><span class="n">1</span><div><b>Encontramos el origen</b><p>De qué escena, de qué frase y de quién viene tu creencia dominante.</p></div></div>
      <div class="step"><span class="n">2</span><div><b>Vemos qué decide por vos</b><p>Qué decisiones con tu dinero e inversiones está tomando hoy, sin que te des cuenta.</p></div></div>
      <div class="step"><span class="n">3</span><div><b>La reprogramamos</b><p>Con un proceso guiado, sesión a sesión, hasta que la nueva creencia se vuelve tu forma natural de decidir.</p></div></div>
    </div>
  </section>

  <section class="cta">
    <p class="eyebrow">Tu próximo paso</p>
    <h2>Escribime con tu resultado</h2>
    <p style="color:var(--muted)">Mandame tu perfil por WhatsApp y te cuento cómo trabajamos ${A.arch} en sesiones 1 a 1.</p>
    <a class="btn wa" href="${waUrl}" target="_blank" rel="noopener">Enviar mi resultado por WhatsApp</a>
    <p class="msg">${esc(msg).replace(/\n/g,"<br>")}</p>
    <p class="phone">Si no se abre, escribime a <b>${WA_DISPLAY}</b></p>
    <div class="dl"><button class="ghost" id="dl">Descargar mi mapa (imagen)</button><p class="dlnote" id="dln"></p></div>
  </section>

  <p class="disc">El Mapa del Dinero es una herramienta de autoconocimiento. No es un diagnóstico psicológico ni una recomendación de inversión.</p>
  <div style="padding-top:12px"><button class="ghost" id="again">Volver a hacer el mapa</button></div>
  </div>`;
  document.getElementById("again").onclick=()=>{state.step=-1;state.ans.fill(null);state.org={};render();};
  document.getElementById("dl").onclick=()=>download(sc,rk);
}

/* Imagen descargable 1080x1350 */
function wrapText(ctx,text,x,y,maxW,lh){
  const words=text.split(" ");let line="",yy=y;
  for(const w of words){const t=line?line+" "+w:w; if(ctx.measureText(t).width>maxW && line){ctx.fillText(line,x,yy);line=w;yy+=lh;} else line=t;}
  if(line){ctx.fillText(line,x,yy);yy+=lh;} return yy;
}
async function makeImage(sc,rk){
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#110F0D";x.fillRect(0,0,W,H);
  x.strokeStyle="#3A342A";x.lineWidth=2;x.strokeRect(36,36,W-72,H-72);
  const logo=new Image();logo.src=LOGO;await logo.decode().catch(()=>{});
  if(logo.width){const lh=46,lw=logo.width*lh/logo.height;x.drawImage(logo,90,90,lw,lh);}
  x.fillStyle="#8A7F66";x.font="bold 20px Arial";x.textAlign="right";x.fillText("MAPA DEL DINERO",W-90,122);x.textAlign="left";
  const top=rk[0],A=B[top];
  x.fillStyle="#B8AE95";x.font="24px Arial";x.fillText(`El mapa de ${state.lead.name}`,90,210);
  x.fillStyle="#C5A55A";x.font="bold 18px Arial";x.fillText("TU CREENCIA DOMINANTE",90,262);
  x.font="84px Georgia";x.fillText(A.arch,90,350);
  x.fillStyle="#FAF6EE";x.font="italic 32px Georgia";let y=wrapText(x,A.quote,90,405,900,42);
  // radar
  const cx=330,cy=y+250,R=170,n=6,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  x.strokeStyle="#3A342A";x.lineWidth=1.5;
  [0.33,0.66,1].forEach(f=>{x.beginPath();ORDER.forEach((_,i)=>{const [a,b]=pt(i,R*f);i?x.lineTo(a,b):x.moveTo(a,b);});x.closePath();x.stroke();});
  ORDER.forEach((_,i)=>{const [a,b]=pt(i,R);x.beginPath();x.moveTo(cx,cy);x.lineTo(a,b);x.stroke();});
  x.beginPath();ORDER.forEach((k,i)=>{const [a,b]=pt(i,Math.max(10,R*sc[k]/100));i?x.lineTo(a,b):x.moveTo(a,b);});x.closePath();
  x.fillStyle="rgba(197,165,90,0.25)";x.fill();x.strokeStyle="#C5A55A";x.lineWidth=3;x.stroke();
  ORDER.forEach((k,i)=>{const [a,b]=pt(i,Math.max(10,R*sc[k]/100));x.fillStyle=level(sc[k])[2];x.beginPath();x.arc(a,b,7,0,7);x.fill();});
  x.font="bold 16px Arial";x.fillStyle="#B8AE95";
  ORDER.forEach((k,i)=>{const [a,b]=pt(i,R+30);x.textAlign=Math.abs(a-cx)<6?"center":(a>cx?"left":"right");x.fillText(B[k].emo.toUpperCase(),a,b+6);});
  x.textAlign="left";
  // legend
  let ly=cy-150;
  ORDER.forEach(k=>{const [,t,col]=level(sc[k]);x.fillStyle="#FAF6EE";x.font="22px Arial";x.fillText(B[k].emo,640,ly);
    x.fillStyle="#221F1B";x.fillRect(640,ly+12,340,10);x.fillStyle=col;x.fillRect(640,ly+12,Math.max(12,340*sc[k]/100),10);
    x.font="bold 14px Arial";x.textAlign="right";x.fillText(t.toUpperCase(),980,ly);x.textAlign="left";ly+=52;});
  // desbloqueo
  y=cy+R+90;
  x.fillStyle="#231E14";x.fillRect(90,y,900,190);x.strokeStyle="#C5A55A";x.lineWidth=2;x.strokeRect(90,y,900,190);
  x.fillStyle="#C5A55A";x.font="bold 18px Arial";x.fillText("TU DESBLOQUEO",120,y+46);
  x.fillStyle="#E2C67E";x.font="italic 32px Georgia";wrapText(x,A.unlock,120,y+96,840,42);
  x.fillStyle="#8A7F66";x.font="20px Arial";x.fillText(`Segundo punto a trabajar: ${B[rk[1]].arch} (${B[rk[1]].emo})`,90,H-130);
  x.fillStyle="#C5A55A";x.font="italic 24px Georgia";x.fillText("Las creencias no se cambian leyendo. Se reprograman.",90,H-88);
  return await new Promise(r=>c.toBlob(r,"image/png"));
}
async function download(sc,rk){
  const note=document.getElementById("dln");note.textContent="Preparando tu imagen…";
  try{
    const blob=await makeImage(sc,rk);
    const safe=(state.lead.name||"mi").replace(/[^\p{L}\p{N} ]/gu,"").trim().replace(/\s+/g,"-")||"mi";
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=`Mapa-del-Dinero-${safe}.png`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    note.textContent="Listo. Si estás en el celular y no se descargó, sacale una captura de pantalla.";
  }catch(e){ note.textContent="No se pudo descargar. Sacale una captura de pantalla a tu mapa."; }
}
render();
})();
</script>
